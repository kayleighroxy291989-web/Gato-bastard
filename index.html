qqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqq';
const grass=new Audio(GRASS_SRC); grass.preload='auto'; grass.volume=.95;
let audioReady=false;
let W=innerWidth,H=innerHeight,dpr=1,playing=false,last=0,score=0;
let shots=[],particles=[],keys={},nextDisappear=4,disappearTimer=0,touchMove=null;
const player={x:0,y:0,r:17,speed:300};
const gato={x:0,y:0,r:26,visible:true,phase:0,respawn:0};

function resize(){dpr=devicePixelRatio||1;W=innerWidth;H=innerHeight;canvas.width=W*dpr;canvas.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}
addEventListener('resize',resize); resize();
addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(e.key.toLowerCase()==='r')reset()});
addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);

function armAudio(){
  // A real user gesture arms audio on Android/Chrome.
  audioReady=true;
  const a=new Audio(SHOOT_SRC); a.volume=0; a.play().then(()=>{a.pause();a.currentTime=0}).catch(()=>{});
  grass.currentTime=0; grass.volume=.01;
  grass.play().then(()=>{grass.pause();grass.currentTime=0;grass.volume=.95}).catch(()=>{});
}
function playShot(){
  if(!audioReady)return;
  const a=new Audio(SHOOT_SRC); a.volume=.8; a.play().catch(()=>{});
}
function playGrass(){
  if(!audioReady)return;
  grass.pause(); grass.currentTime=0; grass.volume=.95;
  grass.play().catch(()=>{
    // Retry once after a short delay if the mobile browser is stubborn.
    setTimeout(()=>grass.play().catch(()=>{}),80);
  });
}

function reset(){
  player.x=W/2;player.y=H*.58;
  gato.x=90+Math.random()*(W-180);gato.y=120+Math.random()*Math.max(80,H-250);
  gato.visible=true;gato.respawn=0;gato.phase=0;
  shots=[];particles=[];score=0;disappearTimer=0;nextDisappear=4+Math.random()*3;
  playing=true;start.style.display='none';msg.style.opacity=0;
  statusEl.textContent='GATO FOUND. FIRE.';
}
start.onclick=()=>{armAudio();reset()};

function say(t,ms=1300){msg.textContent=t;msg.style.opacity=1;setTimeout(()=>msg.style.opacity=0,ms)}
function boom(x,y){for(let i=0;i<16;i++)particles.push({x,y,vx:(Math.random()-.5)*260,vy:(Math.random()-.5)*260,life:.55})}
function shoot(tx,ty){
  if(!playing)return;
  const a=Math.atan2(ty-player.y,tx-player.x);
  shots.push({x:player.x,y:player.y,vx:Math.cos(a)*760,vy:Math.sin(a)*760,life:1});
  playShot();
}
canvas.addEventListener('click',e=>shoot(e.clientX,e.clientY));

// Phone controls: drag anywhere to move; tap elsewhere to shoot.
let touchStart=null;
canvas.addEventListener('touchstart',e=>{
  e.preventDefault();
  if(!playing)return;
  if(e.touches.length===1){
    const t=e.touches[0]; touchStart={x:t.clientX,y:t.clientY};
  }
},{passive:false});
canvas.addEventListener('touchmove',e=>{
  e.preventDefault();
  if(!playing||!touchStart||e.touches.length!==1)return;
  const t=e.touches[0],dx=t.clientX-touchStart.x,dy=t.clientY-touchStart.y;
  const n=Math.hypot(dx,dy)||1;
  player.x+=Math.max(-1,Math.min(1,dx/70))*player.speed/60;
  player.y+=Math.max(-1,Math.min(1,dy/70))*player.speed/60;
  touchStart={x:t.clientX,y:t.clientY};
},{passive:false});
canvas.addEventListener('touchend',e=>{
  e.preventDefault();
  if(!playing||!touchStart)return;
  const t=e.changedTouches[0],dist=Math.hypot(t.clientX-touchStart.x,t.clientY-touchStart.y);
  if(dist<12)shoot(t.clientX,t.clientY);
  touchStart=null;
},{passive:false});

function update(dt){
  let dx=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0);
  let dy=(keys.s||keys.arrowdown?1:0)-(keys.w||keys.arrowup?1:0);
  if(dx||dy){let n=Math.hypot(dx,dy);player.x+=dx/n*player.speed*dt;player.y+=dy/n*player.speed*dt}
  player.x=Math.max(24,Math.min(W-24,player.x));player.y=Math.max(85,Math.min(H-24,player.y));

  if(gato.visible){
    gato.phase+=dt;
    const a=Math.atan2(player.y-gato.y,player.x-gato.x);
    gato.x+=Math.cos(a+Math.sin(gato.phase)*.7)*24*dt;
    gato.y+=Math.sin(a+Math.sin(gato.phase)*.7)*24*dt;
    disappearTimer+=dt;
    if(disappearTimer>nextDisappear){
      gato.visible=false;gato.respawn=3.0;disappearTimer=0;
      playGrass();
      say('🦗 GRASSHOPPER MODE 🦗',2200);
      statusEl.textContent='GATO HAS VANISHED. FOLLOW THE FUCKING GRASSHOPPERS.';
    }
  } else {
    gato.respawn-=dt;
    if(gato.respawn<=0){
      gato.x=70+Math.random()*Math.max(80,W-140);
      gato.y=100+Math.random()*Math.max(80,H-200);
      gato.visible=true;nextDisappear=4+Math.random()*3;
      statusEl.textContent='GATO FOUND. FIRE.';
      say('GATO FOUND');
    }
  }

  for(const s of shots){s.x+=s.vx*dt;s.y+=s.vy*dt;s.life-=dt}
  shots=shots.filter(s=>s.life>0&&s.x>-30&&s.x<W+30&&s.y>-30&&s.y<H+30);
  if(gato.visible){
    for(const s of shots){
      if(Math.hypot(s.x-gato.x,s.y-gato.y)<gato.r+5){
        score++;boom(gato.x,gato.y);
        gato.x=70+Math.random()*Math.max(80,W-140);gato.y=100+Math.random()*Math.max(80,H-200);
        nextDisappear=2+Math.random()*4;
        statusEl.textContent=`HIT! Bastard hits: ${score}`;
      }
    }
  }
  for(const p of particles){p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt}
  particles=particles.filter(p=>p.life>0);
}

function drawPerson(x,y,headR){
  // Tiny person body with Gato's supplied profile picture as the head.
  ctx.save();ctx.translate(x,y);
  ctx.strokeStyle='#171717';ctx.lineWidth=7;ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(0,headR+4);ctx.lineTo(0,headR+31);ctx.moveTo(0,headR+31);ctx.lineTo(-10,headR+49);ctx.moveTo(0,headR+31);ctx.lineTo(10,headR+49);ctx.moveTo(0,headR+13);ctx.lineTo(-15,headR+25);ctx.moveTo(0,headR+13);ctx.lineTo(15,headR+25);ctx.stroke();
  ctx.fillStyle='#6b3e28';ctx.beginPath();ctx.arc(0,headR+18,12,0,7);ctx.fill();
  if(gatoImg.complete){ctx.save();ctx.beginPath();ctx.arc(0,0,headR,0,7);ctx.clip();ctx.drawImage(gatoImg,-headR,-headR,headR*2,headR*2);ctx.restore()}
  ctx.strokeStyle='#6ee7ff';ctx.lineWidth=2;ctx.beginPath();ctx.arc(0,0,headR+3,0,7);ctx.stroke();
  ctx.restore();
}

function draw(){
  ctx.clearRect(0,0,W,H);
  // Subtle battlefield speckles.
  ctx.fillStyle='rgba(70,100,78,.22)';
  for(let i=0;i<100;i++){let x=(i*137)%W,y=80+((i*83)%Math.max(1,H-80));ctx.fillRect(x,y,2,2)}

  // Player: simple tiny soldier.
  ctx.save();ctx.translate(player.x,player.y);
  ctx.fillStyle='#ddd';ctx.beginPath();ctx.arc(0,0,17,0,7);ctx.fill();
  ctx.fillStyle='#202020';ctx.fillRect(7,-4,28,8);ctx.restore();

  if(gato.visible)drawPerson(gato.x,gato.y,22);

  for(const s of shots){ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(s.x,s.y,4,0,7);ctx.fill()}
  for(const p of particles){ctx.globalAlpha=Math.max(0,p.life*2);ctx.fillStyle='#fff';ctx.fillRect(p.x,p.y,4,4);ctx.globalAlpha=1}
}
function loop(t){const dt=Math.min(.033,(t-last)/1000||0);last=t;if(playing)update(dt);draw();requestAnimationFrame(loop)}
requestAnimationFrame(loop);
</script>
